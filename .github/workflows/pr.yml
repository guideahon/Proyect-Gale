name: Batería de regresión

# Corre en push a cualquier rama y en PR a main. Antes sólo estaba en
# `pull_request: [main]`, y como todo el trabajo vive en ramas feature, el
# workflow nunca se ejecutó ni una vez.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de Python
        run: python -m pip install --quiet jsonschema

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: godot/bin/
          key: godot-4.7.1-stable-a13da4feb

      - name: Descargar Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p godot/bin
          curl -fSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d godot/bin/
          mv godot/bin/Godot_v4.7.1-stable_linux.x86_64 godot/bin/Godot
          chmod +x godot/bin/Godot

      - name: Versión de Godot
        run: godot/bin/Godot --headless --version

      # El addon de OpenXR NO se instala en CI a propósito. Sólo hace falta para
      # el export de Android, que acá no se hace, y cargar su GDExtension hace
      # que Godot headless en Linux aborte al salir (exit 134, SIGABRT) DESPUÉS
      # de completar el import; el mismo síntoma que en Windows aparece como
      # "Pages in use exist at exit in PagedAllocator" sin matar el proceso.
      # Se verifica que el lockfile esté, que es lo que fija la versión.
      - name: Verificar lockfile de addons
        run: test -f addons/LOCKFILE.md && grep -q "godot_openxr_vendors" addons/LOCKFILE.md

      - name: Importar proyecto
        id: import
        run: godot/bin/Godot --headless --path . --import

      - name: Tests unitarios
        id: tests
        run: godot/bin/Godot --headless --path . --script tests/run_all.gd

      - name: Schemas, ejemplos y casos dorados
        id: schemas
        run: python tools/ci/check_schemas.py

      - name: Índice de archivos
        id: index
        run: python tools/ci/build_file_index.py --check

      # Patrón acotado a los errores reales de carga de Godot. El grep anterior
      # buscaba "missing|not found|failed to load" en todo el log, así que
      # cualquier mensaje benigno con esas palabras rompía la build.
      - name: Recursos faltantes
        id: resources
        run: |
          godot/bin/Godot --headless --path . --import 2>&1 | tee /tmp/import.log
          if grep -qE "ERROR:.*(Cannot open file|No loader found|Failed loading resource|Failed to load script)" /tmp/import.log; then
            echo "::error::Recursos faltantes o errores de carga detectados"
            grep -E "ERROR:" /tmp/import.log | head -20
            exit 1
          fi

      - name: Resumen
        if: always()
        run: |
          {
            echo "## Batería de regresión"
            echo ""
            echo "| Paso | Estado |"
            echo "|------|--------|"
            echo "| Import | ${{ steps.import.outcome }} |"
            echo "| Tests | ${{ steps.tests.outcome }} |"
            echo "| Schemas | ${{ steps.schemas.outcome }} |"
            echo "| Índice | ${{ steps.index.outcome }} |"
            echo "| Recursos | ${{ steps.resources.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

name: PR — batería de regresión

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: godot/bin/
          key: godot-4.7.1-stable-a13da4feb

      - name: Download Godot (if not cached)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p godot/bin
          curl -fSL -o godot/bin/Godot_v4.7.1-stable_linux.x86_64.zip \
            "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          unzip -q godot/bin/Godot_v4.7.1-stable_linux.x86_64.zip -d godot/bin/
          mv godot/bin/Godot_v4.7.1-stable_linux.*/Godot_v4.7.1-stable_linux.x86_64 godot/bin/Godot
          chmod +x godot/bin/Godot

      - name: Import project
        run: |
          godot/bin/Godot --headless --path . --import

      - name: Run unit tests
        run: |
          godot/bin/Godot --headless --path . --script tests/run_all.gd

      - name: Check schemas
        run: |
          python -m pip install jsonschema
          python tools/ci/check_schemas.py

      - name: Check file index
        run: |
          python tools/ci/build_file_index.py --check

      - name: Check for missing resources
        run: |
          # Godot reporta recursos faltantes en stderr durante --import.
          # Re-importamos y capturamos errores de "missing" o "not found".
          godot/bin/Godot --headless --path . --import 2>&1 | tee /tmp/import_log.txt
          if grep -qiE "(missing|not found|failed to load)" /tmp/import_log.txt; then
            echo "::error::Recursos faltantes o errores de carga detectados"
            exit 1
          fi

      - name: Export desktop test
        run: |
          # Verifica que el proyecto se puede exportar a desktop sin errores.
          # Requiere export templates instalados; si no están, el paso falla
          # con un mensaje claro en lugar de un error críptico.
          if [ ! -d "godot/templates/4.7.1-stable" ]; then
            echo "::warning::Export templates no instalados; saltando export desktop"
            exit 0
          fi
          godot/bin/Godot --headless --path . --export-debug "Linux" 2>&1 || true

      - name: Report summary
        if: always()
        run: |
          echo "## Batería de regresión" >> $GITHUB_STEP_SUMMARY
          echo "- Import: OK" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: OK" >> $GITHUB_STEP_SUMMARY
          echo "- Schemas: OK" >> $GITHUB_STEP_SUMMARY
          echo "- File index: OK" >> $GITHUB_STEP_SUMMARY
